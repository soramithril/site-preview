<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Jeff's Junk Version Picker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Permanent+Marker&display=swap">
<style>
/* Layout: one sticky tool bar (page, width, name), then one band per section with the four versions side by side; pick under each. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --ink:#1b2024; --mut:#59635e; --line:#dce3de; --green:#17803a; --green-bg:#e3f3e8; --on-green:#ffffff;
  --dark:#23282d; --on-dark:#ffffff; --warn-bg:#fff4cf; --warn-ink:#5c4300; --shot:#e9eeeb;
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --mark:"Permanent Marker","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131718; --surface:#1c2224; --ink:#edf2ee; --mut:#a2ada7; --line:#2e3739; --green:#62d58c; --green-bg:#173020; --on-green:#0d1a12;
  --dark:#edf2ee; --on-dark:#1b2024; --warn-bg:#3b3110; --warn-ink:#f4dc8c; --shot:#262d2f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131718; --surface:#1c2224; --ink:#edf2ee; --mut:#a2ada7; --line:#2e3739; --green:#62d58c; --green-bg:#173020; --on-green:#0d1a12;
  --dark:#edf2ee; --on-dark:#1b2024; --warn-bg:#3b3110; --warn-ink:#f4dc8c; --shot:#262d2f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px}
.brand{font:400 20px/1 var(--mark);color:var(--green);margin-right:auto;white-space:nowrap}
.brand b{font:700 15px/1 var(--sans);color:var(--ink);letter-spacing:-.01em;margin-left:8px}
.pager{display:flex;align-items:center;gap:6px;min-width:0}
.pager select{height:42px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:0 10px;font-weight:600;max-width:52vw}
.sq{height:42px;min-width:42px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{height:39px;padding:0 14px;border:0;background:transparent;font-weight:600;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--dark);color:var(--on-dark)}
#who{height:42px;width:130px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px}
.link{border:0;background:none;color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px 2px}
.status{font-size:13px;color:var(--mut);min-width:9ch}

.intro{padding-block:22px 6px}
.intro h1{font:700 clamp(26px,4.4vw,40px)/1.05 var(--sans);letter-spacing:-.03em;margin:0 0 8px;text-wrap:balance}
.intro h1 span{font:400 1em/1 var(--mark);color:var(--green);letter-spacing:0}
.intro p{margin:0;color:var(--mut);max-width:65ch}
.meter{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600;font-variant-numeric:tabular-nums}
.meter i{flex:0 1 260px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:block}
.meter i b{display:block;height:100%;background:var(--green);width:0}
.note-b{margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-size:14.5px;max-width:70ch}

.row{padding-block:26px;border-top:1px solid var(--line);margin-top:22px}
.row h2{font:700 22px/1.2 var(--sans);letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
.row .sub{margin:0 0 14px;color:var(--mut);font-size:14.5px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.v-phone .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.on{border-color:var(--green);background:var(--green-bg)}
.chip{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.chip i{font-style:normal;display:grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:var(--dark);color:var(--on-dark);font-size:13px}
.shot{display:block;width:100%;border:0;padding:0;background:var(--shot);border-radius:10px;overflow:auto;max-height:560px;cursor:zoom-in}
.crop{position:relative;overflow:hidden;width:100%}
.crop img{position:absolute;left:0;width:100%;max-width:none;display:block}
.none{display:grid;place-items:center;min-height:120px;border-radius:10px;border:2px dashed var(--line);color:var(--mut);font-size:14.5px;text-align:center;padding:14px;flex:1}
.pick{margin-top:auto;height:46px;border-radius:99px;border:2px solid var(--dark);background:var(--surface);font-weight:700}
.card.on .pick,.opt[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.under{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
.opt{height:42px;padding:0 16px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.under textarea{flex:1 1 320px;min-height:42px;height:42px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:9px 12px;resize:vertical}
.only .cards{grid-template-columns:minmax(0,760px)}
.v-phone .only .cards{grid-template-columns:minmax(0,360px)}
.whole{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:30px}
.whole h2{margin:0 0 4px;font:700 22px/1.2 var(--sans);letter-spacing:-.02em}
.whole .under{margin-top:14px}
.next{display:flex;justify-content:space-between;gap:12px;padding-block:22px 60px}
.go{height:50px;padding:0 24px;border-radius:99px;border:0;background:var(--dark);color:var(--on-dark);font-weight:700}

dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(1000px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,14,12,.72)}
.zhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.zhead .chip{margin-right:auto}
.zbody{padding:12px;background:var(--shot)}
.zbody .crop{margin:0 auto}

.res h2{font:700 20px/1.2 var(--sans);margin:28px 0 8px;letter-spacing:-.02em}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
td.win{background:var(--green-bg);font-weight:700}
.tally{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.tally div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.tally b{display:block;font:700 34px/1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tally span{color:var(--mut);font-size:14px}
.notes{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14.5px}
.notes li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.notes em{font-style:normal;color:var(--mut)}
#copyout{width:100%;min-height:160px;margin-top:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;font:13px/1.5 ui-monospace,Consolas,monospace}

@media (max-width:820px){
  .cards,.v-phone .cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:8px;margin-inline:-4px;padding-inline:4px}
  .card{flex:0 0 86%;scroll-snap-align:center}
  .v-phone .card{flex-basis:74%}
  .only .card{flex-basis:100%}
  .shot{max-height:62vh}
  .tally{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand b{display:none}
  .status{order:9;width:100%}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s,background-color .15s}}
</style>

  db.collection('picks').onSnapshot(snap => {
    all = snap.docs.map(x => ({ id: x.id, ...x.data() }));
    if (!snap.metadata.fromCache) { loaded = true; clearTimeout(slow); if ($('#status').textContent.indexOf('loading') > -1) status(''); }
    const ch = hydrate();
    if (showResults) results(); else if (ch && !document.activeElement.matches('textarea')) page();
    opts();
  }, err => { clearTimeout(slow); status('Saved on this device only'); note(true); });
})();

/* ---------- one page ---------- */
function crop(p, ver, cell, w) {
  const im = p.imgs[view][ver], y = cell[0], h = Math.max(cell[1], 1);
  return '<div class="crop" style="aspect-ratio:' + W[view] + '/' + h + (w ? ';max-width:' + w + 'px' : '') + '"><img src="' + im.src + '" alt="" decoding="async" style="top:' + (-y / h * 100) + '%"></div>';
}
function countDone(p) { const e = mine[p.slug]; if (!e) return 0; return p.rows.filter(r => e.picks[r.k]).length; }
function opts() {
  const sel = $('#page'), cur = sel.value;
  sel.innerHTML = DATA.map((p, i) => '<option value="' + i + '">' + (countDone(p) >= p.rows.length ? '✓ ' : '') + esc(p.name) + '</option>').join('');
  sel.value = String(pi);
}
function meter(p) { const n = countDone(p), m = $('#meter'); if (!m) return; m.querySelector('span').textContent = n + ' of ' + p.rows.length + ' sections picked'; m.querySelector('b').style.width = (n / p.rows.length * 100) + '%'; }
function page() {
  showResults = false; const p = DATA[pi], e = entry(p.slug);
  $('#v-desk').setAttribute('aria-pressed', view === 'desk'); $('#v-phone').setAttribute('aria-pressed', view === 'phone');
  let h = '<div class="intro"><h1>' + esc(p.name) + ': pick your <span>favourites</span></h1>' +
    '<p>Each section of this page is shown in the mockup we have now and in the three new versions. Tap the one you like best. Tap a picture to see it bigger. Your picks save as you go.</p>' +
    '<div class="meter" id="meter"><i><b></b></i><span></span></div>' +
    (SITE ? '<p class="note-b">Your picks are saved in this browser as you go, so you can stop and come back. When you are done, open "See all picks" and press Email my picks.</p></div>'
      : '<p class="note-b" id="local-note"' + (db ? ' hidden' : '') + '>Your picks are saved on this device only. When you are done, open "See all picks" and use Copy my picks to send them.</p></div>');
  p.rows.forEach(r => {
    const cells = r.c[view] || {}, pick = e.picks[r.k] || '';
    h += '<section class="row' + (r.only ? ' only' : '') + '" data-k="' + r.k + '"><h2>' + esc(r.label) + '</h2>';
    if (r.only) {
      h += '<p class="sub">Only the current mockup has this section. The new versions leave it out.</p><div class="cards"><article class="card">' +
        (cells.current ? '<button class="shot" type="button" data-zoom="current">' + crop(p, 'current', cells.current) + '</button>' : '<div class="none">Not shown at this screen size</div>') + '</article></div>' +
        '<div class="under"><button class="opt" type="button" data-pick="keep" aria-pressed="' + (pick === 'keep') + '">Keep it</button><button class="opt" type="button" data-pick="drop" aria-pressed="' + (pick === 'drop') + '">Drop it</button>';
    } else {
      h += '<p class="sub">' + (cells.current ? 'Current is the closest matching section of the mockup we have now.' : 'The current mockup has no section like this one.') + '</p><div class="cards">';
      VERS.forEach(([v, n, name]) => {
        const c = cells[v];
        h += '<article class="card' + (pick === v ? ' on' : '') + '" data-v="' + v + '"><div class="chip"><i>' + n + '</i>' + name + '</div>' +
          (c ? '<button class="shot" type="button" data-zoom="' + v + '" aria-label="See ' + name + ' bigger">' + crop(p, v, c) + '</button><button class="pick" type="button" data-pick="' + v + '">' + (pick === v ? '✓ Picked' : 'Pick this one') + '</button>'
            : '<div class="none">No section like this in this version</div>') + '</article>';
      });
      h += '</div><div class="under">';
    }
    h += '<textarea id="n-' + p.slug + '-' + r.k + '" data-note placeholder="Add a note (optional)" aria-label="Note about ' + esc(r.label) + '">' + esc(e.notes[r.k] || '') + '</textarea></div></section>';
  });
  h += '<div class="whole"><h2>The whole ' + esc(p.name) + ' page</h2><p class="sub" style="margin:0">Looking at it all together, which version wins?</p><div class="under">' +
    VERS.map(([v, n, name]) => '<button class="opt" type="button" data-overall="' + v + '" aria-pressed="' + (e.overall === v) + '">' + (v === 'current' ? '' : n + ' ') + name + '</button>').join('') + '</div></div>' +
    '<div class="next"><button class="opt" type="button" data-step="-1"' + (pi ? '' : ' disabled') + '>&#8249; Previous page</button>' +
    (pi < DATA.length - 1 ? '<button class="go" type="button" data-step="1">Next: ' + esc(DATA[pi + 1].name) + ' &#8250;</button>' : '<button class="go" type="button" data-res>See all picks</button>') + '</div>';
  app.className = 'wrap v-' + view; app.innerHTML = h; meter(p); opts();
  $('#tores').textContent = 'See all picks';
}

app.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (showResults) { if (t.dataset.back) { go(pi); } if (t.dataset.copy) copyText(t.dataset.copy); if (t.dataset.jump) { go(+t.dataset.jump); } return; }
  const p = DATA[pi], e = entry(p.slug), row = t.closest('.row');
  if (t.dataset.step) return go(pi + +t.dataset.step);
  if (t.hasAttribute('data-res')) return results(true);
  if (t.dataset.overall) { e.overall = e.overall === t.dataset.overall ? '' : t.dataset.overall; t.parentNode.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', b.dataset.overall === e.overall)); return save(p.slug); }
  if (t.dataset.zoom && row) return zoom(row.dataset.k, t.dataset.zoom);
  if (t.dataset.pick && row) setPick(row.dataset.k, t.dataset.pick);
});
function setPick(k, v) {
  const p = DATA[pi], e = entry(p.slug), row = app.querySelector('.row[data-k="' + k + '"]');
  if (e.picks[k] === v) delete e.picks[k]; else e.picks[k] = v;
  const now = e.picks[k] || '';
  row.querySelectorAll('.card[data-v]').forEach(c => { const on = c.dataset.v === now; c.classList.toggle('on', on); const b = c.querySelector('.pick'); if (b) b.textContent = on ? '✓ Picked' : 'Pick this one'; });
  row.querySelectorAll('.opt[data-pick]').forEach(b => b.setAttribute('aria-pressed', b.dataset.pick === now));
  meter(p); opts(); save(p.slug);
}
app.addEventListener('input', ev => {
  const t = ev.target; if (!t.matches('[data-note]')) return;
  const p = DATA[pi], e = entry(p.slug), k = t.closest('.row').dataset.k, v = t.value.trim().slice(0, 600);
  if (v) e.notes[k] = v; else delete e.notes[k]; save(p.slug);
});
function go(i) { pi = Math.max(0, Math.min(DATA.length - 1, i)); ls.set('jjpPage', DATA[pi].slug); page(); scrollTo(0, 0); backLink(); }
function backLink() { const b = $('#backsite'); b.hidden = !SITE; b.href = '../mix-' + DATA[pi].slug + '.html'; }
$('#page').addEventListener('change', e => go(+e.target.value));
$('#prev').addEventListener('click', () => go(pi - 1)); $('#nextb').addEventListener('click', () => go(pi + 1));
['desk', 'phone'].forEach(v => $('#v-' + v).addEventListener('click', () => { view = v; ls.set('jjpView', v); if (showResults) { showResults = false; } page(); }));
whoEl.addEventListener('change', () => { ls.set('jjpWho', whoEl.value.trim()); Object.keys(mine).forEach(s => { const e = mine[s]; if (Object.keys(e.picks).length || e.overall || Object.keys(e.notes).length) save(s); }); });
$('#tores').addEventListener('click', () => showResults ? go(pi) : results(true));

/* ---------- bigger view ---------- */
const dlg = $('#zoom'); let zk = '', zv = '';
function zoom(k, v) {
  const p = DATA[pi], r = p.rows.find(x => x.k === k), c = r.c[view][v]; if (!c) return;
  zk = k; zv = v; const ver = VERS.find(x => x[0] === v);
  $('#zchip').innerHTML = '<i>' + ver[1] + '</i>' + ver[2] + ' · ' + esc(r.label);
  $('#zbody').innerHTML = crop(p, v, c, W[view]);
  const zp = $('#zpick'); zp.hidden = !!r.only; zp.textContent = entry(p.slug).picks[k] === v ? '✓ Picked' : 'Pick this one';
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
}
$('#zclose').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
$('#zpick').addEventListener('click', () => { setPick(zk, zv); dlg.close(); });

/* ---------- everyone's picks ---------- */
function people() {
  const by = {}; all.forEach(d => { if (d && d.who && d.slug) (by[d.who] = by[d.who] || { name: '', pages: {} }, by[d.who].name = d.name || by[d.who].name, by[d.who].pages[d.slug] = d); });
  if (!by[key]) by[key] = { name: whoEl.value.trim(), pages: {} };
  Object.keys(mine).forEach(s => { by[key].pages[s] = { ...mine[s], slug: s }; }); by[key].name = whoEl.value.trim() || by[key].name;
  return by;
}
const label = (by, w) => (by[w].name || 'Someone') + (w === key ? ' (you)' : '');
function results(top) {
  showResults = true; const by = people(), ids = Object.keys(by);
  const tally = { current: 0, board: 0, truck: 0, tiles: 0 }, overall = { current: 0, board: 0, truck: 0, tiles: 0 };
  let body = '';
  DATA.forEach((p, i) => {
    const rows = p.rows.map(r => {
      const cols = {}; let any = false, notes = [];
      ids.forEach(w => { const d = by[w].pages[p.slug]; if (!d) return; const v = (d.picks || {})[r.k]; if (v) { (cols[v] = cols[v] || []).push(label(by, w)); any = true; if (tally[v] !== undefined) tally[v]++; } const n = (d.notes || {})[r.k]; if (n) notes.push([label(by, w), n]); });
      return { r, cols, any, notes };
    }).filter(x => x.any || x.notes.length);
    const ov = ids.map(w => { const d = by[w].pages[p.slug]; if (d && d.overall && overall[d.overall] !== undefined) { overall[d.overall]++; return label(by, w) + ': ' + VNAME[d.overall]; } return ''; }).filter(Boolean);
    if (!rows.length && !ov.length) return;
    body += '<h2>' + esc(p.name) + ' <button class="link" type="button" data-jump="' + i + '">open</button></h2>' + (ov.length ? '<p class="sub" style="margin:0 0 8px">Whole page: ' + esc(ov.join(' · ')) + '</p>' : '');
    if (rows.length) {
      body += '<div class="tw"><table><thead><tr><th>Section</th><th>Current</th><th>1 The board</th><th>2 Fill the truck</th><th>3 Big type and tiles</th></tr></thead><tbody>';
      rows.forEach(x => {
        const max = Math.max(0, ...['current', 'board', 'truck', 'tiles'].map(v => (x.cols[v] || []).length));
        body += '<tr><td>' + esc(x.r.label) + (x.r.only ? '<br><em style="font-style:normal;color:var(--mut)">' + esc([].concat((x.cols.keep || []).map(n => n + ': keep it'), (x.cols.drop || []).map(n => n + ': drop it')).join(' · ')) + '</em>' : '') + '</td>' +
          ['current', 'board', 'truck', 'tiles'].map(v => { const a = x.cols[v] || []; return '<td' + (a.length && a.length === max ? ' class="win"' : '') + '>' + esc(a.join(', ')) + '</td>'; }).join('') + '</tr>';
      });
      body += '</tbody></table></div>';
      const ns = rows.flatMap(x => x.notes.map(n => '<li><em>' + esc(x.r.label) + ' · ' + esc(n[0]) + ':</em> ' + esc(n[1]) + '</li>'));
      if (ns.length) body += '<ul class="notes">' + ns.join('') + '</ul>';
    }
  });
  app.className = 'wrap res';
  app.innerHTML = '<div class="intro"><h1>All picks <span>so far</span></h1><p>Section picks counted across every page and everyone who has picked. ' + (db ? 'This list updates by itself.' : SITE ? 'These are your picks in this browser. Email them when you are done.' : 'Only this device\'s picks are shown here.') + '</p>' +
    '<div class="tally">' + VERS.map(([v, n, name]) => '<div><b>' + tally[v] + '</b><span>' + (v === 'current' ? '' : n + ' ') + name + '<br>' + overall[v] + ' whole page ' + (overall[v] === 1 ? 'win' : 'wins') + '</span></div>').join('') + '</div></div>' +
    (body || '<p class="note-b">No picks yet. Go back and tap a favourite in any section.</p>') +
    '<div class="next"><button class="go" type="button" data-back="1">&#8249; Back to picking</button>' + (SITE ? '<span style="display:flex;flex-wrap:wrap;gap:8px"><button class="go" type="button" data-copy="mail">Email my picks</button><button class="opt" type="button" data-copy="file">Download</button><button class="opt" type="button" data-copy="1">Copy</button></span>' : '<button class="opt" type="button" data-copy="1">Copy my picks as text</button>') + '</div><textarea id="copyout" hidden readonly aria-label="My picks as text"></textarea>';
  $('#tores').textContent = 'Back to picking'; if (top) scrollTo(0, 0);
}
function copyText(how) {
  let out = 'Version picks' + (whoEl.value.trim() ? ' from ' + whoEl.value.trim() : '') + '\n';
  DATA.forEach(p => { const e = mine[p.slug]; if (!e) return; const lines = p.rows.filter(r => e.picks[r.k] || e.notes[r.k]).map(r => '- ' + r.label + ': ' + (VNAME[e.picks[r.k]] || 'no pick') + (e.notes[r.k] ? ' (' + e.notes[r.k] + ')' : ''));
    if (!lines.length && !e.overall) return; out += '\n' + p.name.toUpperCase() + (e.overall ? ' (whole page: ' + VNAME[e.overall] + ')' : '') + '\n' + lines.join('\n') + '\n'; });
  const ta = $('#copyout'); ta.hidden = false; ta.value = out;
  if (how === 'mail') { location.href = 'mailto:?subject=' + encodeURIComponent("Jeff's Junk website picks" + (whoEl.value.trim() ? ' from ' + whoEl.value.trim() : '')) + '&body=' + encodeURIComponent(out); return; }
  if (how === 'file') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'text/plain' })); a.download = 'website-picks.txt'; a.click(); return; }
  const done = () => { ta.focus(); ta.select(); };
  try { navigator.clipboard.writeText(out).then(() => { status('Copied'); done(); }, done); } catch (e) { done(); }
}

const startSlug = DATA.some(p => p.slug === location.hash.slice(1)) ? location.hash.slice(1) : ls.get('jjpPage'); pi = Math.max(0, DATA.findIndex(p => p.slug === startSlug));
if (DATA.length) { page(); backLink(); } else app.innerHTML = '<div class="intro"><h1>No pages yet</h1></div>';
</script>
</body></html>
